<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#071018"
    >

    <title>IBVAP Mobile Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                linear-gradient(
                    180deg,
                    #050b10 0%,
                    #071018 100%
                );

            color: #e8f7f7;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 18px;
        }

        .container {
            width: 100%;
            max-width: 900px;

            background: #0b1720;

            border:
                1px solid #17333d;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.35);
        }

        .header {
            margin-bottom: 16px;
        }

        .title {
            margin: 0;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: 0.4px;
        }

        .subtitle {
            margin-top: 6px;

            color: #86a3aa;

            font-size: 13px;

            line-height: 1.5;
        }

        .video-container {
            position: relative;

            width: 100%;

            background: #000;

            border-radius: 10px;

            overflow: hidden;

            aspect-ratio: 16 / 9;

            border:
                1px solid #17333d;
        }

        #video {
            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            background: #000;
        }

        .status {
            margin-top: 14px;

            padding: 11px 13px;

            background: #071018;

            border:
                1px solid #17333d;

            border-radius: 8px;

            color: #9fb8bd;

            font-size: 14px;

            line-height: 1.4;
        }

        .controls {
            display: flex;

            gap: 10px;

            margin-top: 14px;
        }

        button {
            flex: 1;

            min-height: 46px;

            border: 0;

            border-radius: 8px;

            padding: 12px 14px;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition:
                transform 0.08s ease,
                opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.985);
        }

        button:hover {
            opacity: 0.92;
        }

        #startButton {
            background: #19b6a5;

            color: #031012;
        }

        #stopButton {
            background: #263640;

            color: #e8f7f7;
        }

        .info {
            margin-top: 12px;

            color: #718c93;

            font-size: 12px;

            line-height: 1.55;

            text-align: center;
        }

        @media
        (max-width: 600px)
        {
            body {
                padding: 10px;
            }

            .container {
                padding: 13px;

                border-radius: 11px;
            }

            .title {
                font-size: 19px;
            }

            .subtitle {
                font-size: 12px;
            }

            .controls {
                gap: 8px;
            }

            button {
                min-height: 44px;

                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">

            <h1 class="title">
                IBVAP Mobile Camera
            </h1>

            <div class="subtitle">
                Mobile video source for the
                IBVAP border surveillance system
            </div>

        </header>


        <section class="video-container">

            <video
                id="video"
                autoplay
                muted
                playsinline
            ></video>

        </section>


        <div
            id="status"
            class="status"
        >
            Starting...
        </div>


        <div class="controls">

            <button
                id="startButton"
                type="button"
            >
                START CAMERA
            </button>

            <button
                id="stopButton"
                type="button"
            >
                STOP
            </button>

        </div>


        <div class="info">
            H.264 real-time video transmission.
            Video is sent directly to the IBVAP
            workstation over the local network.
        </div>

    </main>


<script>
"use strict";


const video =
    document.getElementById("video");


const statusElement =
    document.getElementById("status");


const startButton =
    document.getElementById("startButton");


const stopButton =
    document.getElementById("stopButton");


/*
 * =========================================================
 * LOW-LATENCY CONFIGURATION
 * =========================================================
 */

const TARGET_WIDTH = 1280;

const TARGET_HEIGHT = 720;

const TARGET_FPS = 24;

const TARGET_BITRATE = 2_500_000;


/*
 * One recovery point approximately every second.
 */

const KEYFRAME_INTERVAL = 24;


/*
 * Keep transport buffering bounded.
 *
 * 64 KB is still tiny compared with allowing
 * seconds of video to accumulate.
 */

const MAX_SOCKET_BUFFER = 64 * 1024;


/*
 * Never intentionally build an encoder backlog.
 */

const MAX_ENCODER_QUEUE = 1;


/*
 * =========================================================
 * SOURCE
 * =========================================================
 */

const params =
    new URLSearchParams(
        window.location.search
    );


const sourceId =
    params.get("source") ||
    "mobile-1";


/*
 * =========================================================
 * STATE
 * =========================================================
 */

let socket = null;

let stream = null;

let videoTrack = null;

let processor = null;

let reader = null;

let encoder = null;

let running = false;

let frameCounter = 0;


/*
 * The next accepted frame must become a keyframe.
 */

let forceKeyFrame = false;


/*
 * While network recovery is happening,
 * don't send arbitrary delta frames.
 */

let waitingForKeyFrameOutput = false;


/*
 * =========================================================
 * STATUS
 * =========================================================
 */

function setStatus(message)
{
    statusElement.textContent =
        message;
}


/*
 * =========================================================
 * CAMERA
 * =========================================================
 */

async function startCamera()
{
    if (stream)
    {
        return;
    }

    stream =
        await navigator.mediaDevices.getUserMedia(
        {
            video:
            {
                facingMode:
                {
                    ideal: "environment"
                },

                width:
                {
                    ideal: TARGET_WIDTH,
                    max: TARGET_WIDTH
                },

                height:
                {
                    ideal: TARGET_HEIGHT,
                    max: TARGET_HEIGHT
                },

                frameRate:
                {
                    ideal: TARGET_FPS,
                    max: TARGET_FPS
                }
            },

            audio: false
        });


    const tracks =
        stream.getVideoTracks();


    if (tracks.length === 0)
    {
        throw new Error(
            "No camera track was created."
        );
    }


    videoTrack =
        tracks[0];


    try
    {
        videoTrack.contentHint =
            "motion";
    }
    catch (error)
    {
    }


    video.srcObject =
        stream;


    await video.play();


    console.log(
        "Camera settings:",
        videoTrack.getSettings()
    );


    setStatus(
        "Camera ready"
    );
}


/*
 * =========================================================
 * H.264 CAPABILITY
 * =========================================================
 */

async function getH264Codec(
    width,
    height
)
{
    if (
        typeof VideoEncoder ===
        "undefined"
    )
    {
        throw new Error(
            "WebCodecs VideoEncoder is not supported."
        );
    }


    const candidates =
    [
        "avc1.42E01F",
        "avc1.4D001F",
        "avc1.42002A"
    ];


    for (
        const codec of candidates
    )
    {
        try
        {
            const result =
                await VideoEncoder.isConfigSupported(
                {
                    codec,

                    width,

                    height,

                    bitrate:
                        TARGET_BITRATE,

                    framerate:
                        TARGET_FPS,

                    bitrateMode:
                        "variable",

                    latencyMode:
                        "realtime",

                    hardwareAcceleration:
                        "prefer-hardware",

                    avc:
                    {
                        format:
                            "annexb"
                    }
                });


            if (result.supported)
            {
                console.log(
                    "Using H.264 codec:",
                    codec
                );

                return codec;
            }
        }
        catch (error)
        {
            console.warn(
                "H.264 candidate failed:",
                codec,
                error
            );
        }
    }


    throw new Error(
        "No supported H.264 encoder was found."
    );
}


/*
 * =========================================================
 * WEBSOCKET
 * =========================================================
 */

function connectSocket()
{
    return new Promise(
        (
            resolve,
            reject
        ) =>
        {
            const protocol =
                window.location.protocol ===
                "https:"
                    ? "wss:"
                    : "ws:";


            const url =
                protocol +
                "//" +
                window.location.host +
                "/mobile/ws";


            socket =
                new WebSocket(
                    url
                );


            socket.binaryType =
                "arraybuffer";


            socket.onopen =
                () =>
                {
                    /*
                     * Identify this mobile camera
                     * before any H.264 data is sent.
                     */

                    socket.send(
                        "SOURCE:" +
                        sourceId
                    );


                    setStatus(
                        "Connected"
                    );


                    resolve();
                };


            /*
             * =================================================
             * NETWORK TELEMETRY
             * =================================================
             *
             * IBVAP periodically sends:
             *
             *     IBVAP_NET_PING:<sequence>:<timestamp>
             *
             * The phone immediately echoes:
             *
             *     IBVAP_NET_PONG:<sequence>:<timestamp>
             *
             * This control message is completely separate
             * from the binary H.264 video stream.
             *
             * No camera frame is delayed, modified or
             * discarded because of telemetry.
             */

            socket.onmessage =
                (event) =>
                {
                    if (
                        typeof event.data !==
                        "string"
                    )
                    {
                        /*
                         * Binary messages are not expected
                         * from the workstation.
                         *
                         * H.264 travels in the opposite
                         * direction, phone -> workstation.
                         */

                        return;
                    }


                    const message =
                        event.data;


                    if (
                        !message.startsWith(
                            "IBVAP_NET_PING:"
                        )
                    )
                    {
                        return;
                    }


                    /*
                     * Immediately echo the sequence
                     * and server timestamp.
                     */

                    if (
                        socket &&
                        socket.readyState ===
                            WebSocket.OPEN
                    )
                    {
                        socket.send(
                            "IBVAP_NET_PONG:" +
                            message.substring(
                                "IBVAP_NET_PING:".length
                            )
                        );
                    }
                };


            socket.onerror =
                () =>
                {
                    reject(
                        new Error(
                            "WebSocket connection failed."
                        )
                    );
                };


            socket.onclose =
                () =>
                {
                    if (running)
                    {
                        setStatus(
                            "Connection lost"
                        );
                    }
                };
        }
    );
}


/*
 * =========================================================
 * ENCODER
 * =========================================================
 */

async function startEncoder(
    width,
    height
)
{
    const codec =
        await getH264Codec(
            width,
            height
        );


    encoder =
        new VideoEncoder(
        {
            output:
                handleEncodedChunk,

            error:
                handleEncoderError
        });


    encoder.configure(
    {
        codec,

        width,

        height,

        bitrate:
            TARGET_BITRATE,

        framerate:
            TARGET_FPS,

        bitrateMode:
            "variable",

        latencyMode:
            "realtime",

        hardwareAcceleration:
            "prefer-hardware",

        avc:
        {
            format:
                "annexb"
        }
    });


    frameCounter = 0;

    forceKeyFrame = true;

    waitingForKeyFrameOutput = false;
}


/*
 * =========================================================
 * H.264 OUTPUT
 * =========================================================
 */

function handleEncodedChunk(
    chunk
)
{
    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    )
    {
        return;
    }


    /*
     * Network congestion:
     *
     * Do NOT keep sending stale P-frames.
     *
     * The next accepted frame will be forced
     * to become a keyframe.
     */

    if (
        socket.bufferedAmount >
        MAX_SOCKET_BUFFER
    )
    {
        forceKeyFrame = true;

        waitingForKeyFrameOutput = true;

        return;
    }


    /*
     * During recovery, discard delta frames.
     *
     * Only a clean keyframe is allowed to restart
     * the transport.
     */

    if (
        waitingForKeyFrameOutput
    )
    {
        if (
            chunk.type !==
            "key"
        )
        {
            return;
        }


        waitingForKeyFrameOutput =
            false;
    }


    const buffer =
        new ArrayBuffer(
            chunk.byteLength
        );


    chunk.copyTo(
        new Uint8Array(
            buffer
        )
    );


    /*
     * Final congestion check.
     */

    if (
        socket.bufferedAmount >
        MAX_SOCKET_BUFFER
    )
    {
        forceKeyFrame = true;

        waitingForKeyFrameOutput = true;

        return;
    }


    socket.send(
        buffer
    );
}


/*
 * =========================================================
 * ENCODER ERROR
 * =========================================================
 */

function handleEncoderError(
    error
)
{
    console.error(
        "H.264 encoder error:",
        error
    );


    setStatus(
        "H.264 encoder error"
    );
}


/*
 * =========================================================
 * FRAME PROCESSOR
 * =========================================================
 */

async function startFrameProcessor()
{
    if (
        typeof MediaStreamTrackProcessor ===
        "undefined"
    )
    {
        throw new Error(
            "MediaStreamTrackProcessor is not supported."
        );
    }


    processor =
        new MediaStreamTrackProcessor(
        {
            track:
                videoTrack
        });


    reader =
        processor.readable.getReader();


    await processCameraFrames();
}


/*
 * =========================================================
 * CAMERA FRAME LOOP
 * =========================================================
 */

async function processCameraFrames()
{
    while (running)
    {
        let result;


        try
        {
            result =
                await reader.read();
        }
        catch (error)
        {
            if (running)
            {
                console.error(
                    "Camera reader:",
                    error
                );
            }


            break;
        }


        if (result.done)
        {
            break;
        }


        const frame =
            result.value;


        if (!frame)
        {
            continue;
        }


        /*
         * No connection =
         * don't retain camera frames.
         */

        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        )
        {
            frame.close();

            continue;
        }


        /*
         * Never build an encoder queue.
         */

        if (
            !encoder ||
            encoder.state !==
                "configured"
        )
        {
            frame.close();

            continue;
        }


        if (
            encoder.encodeQueueSize >=
            MAX_ENCODER_QUEUE
        )
        {
            frame.close();

            forceKeyFrame = true;

            continue;
        }


        /*
         * Don't waste encoder work if the network
         * is already congested.
         */

        if (
            socket.bufferedAmount >
            MAX_SOCKET_BUFFER
        )
        {
            frame.close();

            forceKeyFrame = true;

            waitingForKeyFrameOutput = true;

            continue;
        }


        const width =
            frame.codedWidth ||
            frame.displayWidth;


        const height =
            frame.codedHeight ||
            frame.displayHeight;


        if (
            width <= 0 ||
            height <= 0
        )
        {
            frame.close();

            continue;
        }


        /*
         * Regular one-second IDR cadence plus immediate
         * recovery IDR when congestion occurred.
         */

        const keyFrame =
            forceKeyFrame ||
            frameCounter === 0 ||
            (
                frameCounter %
                KEYFRAME_INTERVAL
            ) === 0;


        try
        {
            encoder.encode(
                frame,
                {
                    keyFrame
                }
            );


            frameCounter++;


            if (keyFrame)
            {
                forceKeyFrame =
                    false;
            }
        }
        catch (error)
        {
            console.error(
                "H.264 encode:",
                error
            );
        }
        finally
        {
            frame.close();
        }
    }
}


/*
 * =========================================================
 * START
 * =========================================================
 */

async function startStreaming()
{
    if (running)
    {
        return;
    }


    try
    {
        setStatus(
            "Starting camera..."
        );


        await startCamera();


        setStatus(
            "Connecting..."
        );


        await connectSocket();


        const settings =
            videoTrack.getSettings();


        let width =
            settings.width ||
            TARGET_WIDTH;


        let height =
            settings.height ||
            TARGET_HEIGHT;


        width -=
            width % 2;


        height -=
            height % 2;


        /*
         * Never exceed 1280x720.
         */

        if (
            width > TARGET_WIDTH ||
            height > TARGET_HEIGHT
        )
        {
            const scale =
                Math.min(
                    TARGET_WIDTH / width,
                    TARGET_HEIGHT / height
                );


            width =
                Math.floor(
                    width * scale
                ) & ~1;


            height =
                Math.floor(
                    height * scale
                ) & ~1;
        }


        console.log(
            "Encoder resolution:",
            width,
            "x",
            height
        );


        setStatus(
            "Starting H.264..."
        );


        await startEncoder(
            width,
            height
        );


        running =
            true;


        setStatus(
            "LIVE • H.264"
        );


        await startFrameProcessor();
    }
    catch (error)
    {
        console.error(
            error
        );


        setStatus(
            error.message ||
            "Unable to start"
        );


        stopStreaming();
    }
}


/*
 * =========================================================
 * STOP
 * =========================================================
 */

function stopStreaming()
{
    running =
        false;


    if (reader)
    {
        try
        {
            reader.cancel();
        }
        catch (error)
        {
        }


        reader = null;
    }


    processor =
        null;


    if (encoder)
    {
        try
        {
            encoder.close();
        }
        catch (error)
        {
        }


        encoder = null;
    }


    if (socket)
    {
        try
        {
            socket.close();
        }
        catch (error)
        {
        }


        socket = null;
    }


    if (stream)
    {
        for (
            const track of
            stream.getTracks()
        )
        {
            track.stop();
        }


        stream = null;
    }


    videoTrack =
        null;


    video.srcObject =
        null;


    forceKeyFrame =
        false;


    waitingForKeyFrameOutput =
        false;


    setStatus(
        "Stopped"
    );
}


/*
 * =========================================================
 * BUTTONS
 * =========================================================
 */

startButton.onclick =
    () =>
    {
        startStreaming();
    };


stopButton.onclick =
    () =>
    {
        stopStreaming();
    };


/*
 * =========================================================
 * AUTO START
 * =========================================================
 */

window.addEventListener(
    "load",
    () =>
    {
        startStreaming();
    }
);
</script>

</body>
</html>
